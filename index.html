<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Mi Plata</title>
<meta name="theme-color" content="#0E6E55">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
html,body{margin:0;height:100%}
[hidden]{display:none!important}
:root{padding-top:env(safe-area-inset-top,0px)}

/* Layout: una columna tipo app móvil (máx 560px), resumen arriba, navegación fija abajo, hoja deslizable para registrar */
:root{
  --bg:#F3F5F1; --surface:#FFFFFF; --ink:#15201B; --muted:#5E6B64; --line:#DCE3DD;
  --accent:#0E6E55; --accent-ink:#FFFFFF; --accent-soft:#DDEFE7;
  --ok:#1F8A5B; --warn:#B7791F; --bad:#C0392B; --save:#3559B5;
  --c1:#0E6E55; --c2:#C0572B; --c3:#3559B5; --c4:#9A3F8C; --c5:#B7791F; --c6:#2A8C9C; --c7:#6B7A2A; --c8:#7A5C45;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#18211D; --ink:#E7EEEA; --muted:#98A69F; --line:#2A3631;
  --accent:#4CC49B; --accent-ink:#06231A; --accent-soft:#1D3A30;
  --ok:#4CC49B; --warn:#E3AE55; --bad:#EF7A6C; --save:#8AA7F0;
  --c1:#4CC49B; --c2:#EE8A5E; --c3:#8AA7F0; --c4:#D788CB; --c5:#E3AE55; --c6:#5CC6D6; --c7:#B5C45E; --c8:#C9A07F;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18211D; --ink:#E7EEEA; --muted:#98A69F; --line:#2A3631;
  --accent:#4CC49B; --accent-ink:#06231A; --accent-soft:#1D3A30;
  --ok:#4CC49B; --warn:#E3AE55; --bad:#EF7A6C; --save:#8AA7F0;
  --c1:#4CC49B; --c2:#EE8A5E; --c3:#8AA7F0; --c4:#D788CB; --c5:#E3AE55; --c6:#5CC6D6; --c7:#B5C45E; --c8:#C9A07F;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15px;line-height:1.45}
.app{max-width:560px;margin:0 auto;padding:0 16px 120px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em}
.brand span{color:var(--accent)}
.month{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--muted)}
.month button:hover{background:var(--accent-soft);color:var(--ink)}
.month b{font-weight:600;font-size:14px;min-width:118px;text-align:center;text-transform:capitalize}

.banner{background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}

.hero{background:var(--accent);color:var(--accent-ink);border-radius:20px;padding:20px;display:grid;gap:14px}
.hero .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.hero .big{font-family:var(--display);font-weight:800;font-size:clamp(36px,11vw,48px);line-height:1;letter-spacing:-.03em}
.hero .big small{font-size:.5em;font-weight:700;margin-right:4px;opacity:.85}
.hero .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero .row div{min-width:0}
.hero .row .v{font-weight:600;font-size:15px}
.meter{height:8px;border-radius:99px;background:color-mix(in srgb,var(--accent-ink) 22%,transparent);overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent-ink);border-radius:99px}
.hero .note{font-size:13px;opacity:.9}

h2{font-family:var(--display);font-weight:700;font-size:17px;margin:26px 0 10px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
h2 a,h2 button{font-family:var(--body);font-weight:500;font-size:13px;color:var(--accent);background:none;border:0;padding:0}

.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.grow{flex:1;min-width:0}
.t{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s{font-size:12.5px;color:var(--muted)}
.amt{font-weight:600;white-space:nowrap}
.amt.gasto{color:var(--ink)} .amt.ingreso{color:var(--ok)} .amt.ahorro{color:var(--save)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:99px;background:var(--ok)}
.bar.warn i{background:var(--warn)} .bar.over i{background:var(--bad)}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--ink);white-space:nowrap}
.pill.over{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.pill.warn{background:color-mix(in srgb,var(--warn) 20%,transparent);color:var(--warn)}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.del{border:0;background:none;color:var(--muted);font-size:12.5px;padding:6px 8px;border-radius:8px}
.del:hover{background:var(--line)} .del.arm{color:var(--bad);font-weight:600}
.dayhead{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 2px 6px}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:7px 13px;font-size:13.5px;display:inline-flex;align-items:center;gap:7px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.form{display:grid;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.form .r{display:flex;gap:8px;flex-wrap:wrap}
.form .r>*{flex:1 1 120px;min-width:0}
input[type=text],input[type=number],input[type=date],select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.ghost{background:var(--accent-soft);color:var(--ink)}
.budget{width:96px!important;flex:none!important;text-align:right;padding:7px 9px!important}
.stat{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat>div{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat .v{font-family:var(--display);font-weight:700;font-size:20px}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center}
nav.tabs button{border:0;background:none;display:grid;justify-items:center;gap:2px;font-size:11.5px;color:var(--muted);padding:6px 0}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
nav.tabs .add{justify-self:center;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent)}
nav.tabs .add svg{width:26px;height:26px}

.scrim{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.4);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:14px;max-height:92%;overflow:auto}
.sheet h3{font-family:var(--display);font-size:19px;margin:0;display:flex;justify-content:space-between;align-items:center}
.sheet h3 button{border:0;background:var(--bg);width:32px;height:32px;border-radius:50%;font-size:18px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--bg);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amount{display:flex;align-items:baseline;gap:6px;border-bottom:2px solid var(--accent);padding-bottom:4px}
.amount span{font-family:var(--display);font-weight:700;font-size:26px;color:var(--muted)}
.amount input{border:0!important;background:none!important;padding:0!important;font-family:var(--display);font-weight:800;font-size:42px;letter-spacing:-.02em;width:100%;outline:none}
.lbl2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.err{color:var(--bad);font-size:13px;min-height:1em}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;z-index:30}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}

.between{display:flex;justify-content:space-between;gap:8px}
input[type=email],input[type=password]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px}
.loginwrap{min-height:100%;display:grid;place-items:center;padding:40px 16px}
.loginbox{width:100%;max-width:360px;gap:12px;padding:24px}
.loginbox .brand{font-size:30px}
</style>
</head>
<body>
<div id="login" class="loginwrap" hidden>
  <form class="form loginbox" id="loginForm">
    <div class="brand">Mi <span>Plata</span></div>
    <div class="s">Ingresa con tu correo y contraseña.</div>
    <input id="lEmail" type="email" autocomplete="email" placeholder="Correo" required>
    <input id="lPass" type="password" autocomplete="current-password" placeholder="Contraseña" required>
    <div class="err" id="lErr"></div>
    <button class="btn">Entrar</button>
  </form>
</div>

<div class="app" id="appMain" hidden>
  <header class="top">
    <div class="brand">Mi <span>Plata</span></div>
    <div class="month" aria-label="Mes">
      <button id="prevM" aria-label="Mes anterior">‹</button>
      <b id="mLabel"></b>
      <button id="nextM" aria-label="Mes siguiente">›</button>
    </div>
  </header>
  
  <section id="v-inicio"></section>
  <section id="v-movs" hidden></section>
  <section id="v-metas" hidden></section>
  <section id="v-ajustes" hidden></section>
</div>

<nav class="tabs" hidden><div class="in">
  <button data-v="inicio" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</button>
  <button data-v="movs"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Movimientos</button>
  <button class="add" id="openAdd" aria-label="Registrar movimiento"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <button data-v="metas"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></svg>Metas</button>
  <button data-v="ajustes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/></svg>Ajustes</button>
</div></nav>

<div id="scrim" class="scrim" hidden>
  <form class="sheet" id="addForm" autocomplete="off">
    <h3><span id="sheetTitle">Nuevo movimiento</span><button type="button" id="closeAdd" aria-label="Cerrar">×</button></h3>
    <div class="seg" id="tipoSeg">
      <button type="button" data-t="gasto" aria-pressed="true">Gasto</button>
      <button type="button" data-t="ingreso" aria-pressed="false">Ingreso</button>
      <button type="button" data-t="ahorro" aria-pressed="false">Ahorro</button>
    </div>
    <label class="amount"><span>S/</span><input id="fMonto" type="text" inputmode="decimal" placeholder="0.00" aria-label="Monto"></label>
    <div id="catWrap"><div class="lbl2" style="margin-bottom:8px">Categoría</div><div class="chips" id="fCats"></div></div>
    <div class="form" style="padding:0;border:0;background:none">
      <div class="r">
        <input id="fNota" type="text" placeholder="Nota (ej. desayuno, pasaje)" aria-label="Nota">
        <input id="fFecha" type="date" aria-label="Fecha" style="flex:0 1 160px">
      </div>
    </div>
    <div class="err" id="fErr"></div>
    <button class="btn" type="submit" style="padding:14px">Guardar</button>
  </form>
</div>
<div class="toast" id="toast" hidden></div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
